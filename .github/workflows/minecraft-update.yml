# Keeps Open NPC up with Minecraft.
#
# Every day: is there a new Minecraft release, and does Fabric support it yet? If so, the mod is built for it and its in-game tests
# run (a headless server, then the real game with the built jar). If they pass, the version is added to mod/versions.json and a
# GitHub Release with the jar goes up. If they fail, the attempt is kept on a branch named update/mc-<version> with the error in
# mod/UPDATE-FAILED.md, and an issue is opened; a fix comes back as a pull request, and nothing goes out until it is merged.
#
# On every push and pull request that touches the mod: the mod is built and tested for every version in mod/versions.json. On a
# push to main, each version marked "release" whose tests pass gets a GitHub Release for the mod version in gradle.properties,
# once (tag v<mod version>-mc<minecraft>, notes from mod/CHANGELOG.md, made by mod/tools/release.sh).
name: Minecraft update

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Try a new Minecraft version without releasing, committing or opening anything'
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['mod/**', '.github/workflows/minecraft-update.yml']
  pull_request:
    paths: ['mod/**', '.github/workflows/minecraft-update.yml']

permissions:
  contents: write
  issues: write

concurrency:
  group: minecraft-update-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: mod

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      new: ${{ steps.check.outputs.new }}
      ready: ${{ steps.check.outputs.ready }}
      loader: ${{ steps.check.outputs.loader }}
      fabric_api: ${{ steps.check.outputs.fabric_api }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: matrix
        run: node tools/mc_update.mjs matrix
      - id: check
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node tools/mc_update.mjs check

  # The versions already supported: build and test each one.
  test:
    needs: plan
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: test (Minecraft ${{ matrix.minecraft }})
    env:
      VERSIONS: -Pminecraft_version=${{ matrix.minecraft }} -Ploader_version=${{ matrix.loader }} -Pfabric_api_version=${{ matrix.fabric_api }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: A screen for the real-game test
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-vulkan-drivers
      - name: Build, and the in-game tests on a headless server
        run: ./gradlew build $VERSIONS --console=plain
      - name: The real game, with the built jar in its mods folder
        timeout-minutes: 30
        run: ./gradlew runProductionClientGameTest $VERSIONS --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: open-npc-mc${{ matrix.minecraft }}
          path: |
            mod/build/libs/open-npc-*+mc${{ matrix.minecraft }}.jar
            mod/run/production/screenshots/
          if-no-files-found: ignore
      - name: Release (each mod version, once per Minecraft version marked for release)
        if: matrix.release && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
        run: bash tools/release.sh "${{ matrix.minecraft }}" "${{ matrix.loader }}" "${{ matrix.fabric_api }}" "$GITHUB_SHA"

  # A new Minecraft release that Fabric supports: try it.
  update:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    env:
      MC: ${{ needs.plan.outputs.new }}
      LOADER: ${{ needs.plan.outputs.loader }}
      API: ${{ needs.plan.outputs.fabric_api }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: A screen for the real-game test
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-vulkan-drivers
      - name: Build and test for the new version
        id: try
        continue-on-error: true
        run: |
          set -o pipefail
          V="-Pminecraft_version=$MC -Ploader_version=$LOADER -Pfabric_api_version=$API"
          ./gradlew build $V --console=plain 2>&1 | tee ../update.log
          ./gradlew runProductionClientGameTest $V --console=plain 2>&1 | tee -a ../update.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: update-mc${{ needs.plan.outputs.new }}
          path: |
            update.log
            mod/build/libs/open-npc-*+mc${{ needs.plan.outputs.new }}.jar
            mod/run/production/screenshots/
          if-no-files-found: ignore
      - name: "It works: add the version and release it"
        if: steps.try.outcome == 'success' && (github.event_name == 'schedule' || !inputs.dry_run)
        run: |
          node tools/mc_update.mjs add "$MC" "$LOADER" "$API"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "Support Minecraft $MC (automatic update: built and tested)"
          git push origin HEAD:main
          bash tools/release.sh "$MC" "$LOADER" "$API" "$(git rev-parse HEAD)" automatic
      - name: "It does not work yet: keep the attempt on a branch for a fix"
        if: steps.try.outcome != 'success' && (github.event_name == 'schedule' || !inputs.dry_run)
        run: |
          BRANCH="update/mc-$MC"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "$BRANCH is already there, waiting for a fix"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH"
            node tools/mc_update.mjs add "$MC" "$LOADER" "$API"
            {
              echo "# Minecraft $MC: the update build failed"
              echo
              echo "Loader $LOADER, Fabric API $API. Make \`./gradlew build\` and \`./gradlew runProductionClientGameTest\` pass for"
              echo "this version (pass \`-Pminecraft_version=$MC -Ploader_version=$LOADER -Pfabric_api_version=$API\`) without breaking the"
              echo "versions already in versions.json, then delete this file and open a pull request to main."
              echo
              echo "## The end of the build log"
              echo
              echo '```'
              tail -c 20000 ../update.log
              echo '```'
            } > UPDATE-FAILED.md
            git add versions.json UPDATE-FAILED.md
            git commit -m "Minecraft $MC: update build failed (details in mod/UPDATE-FAILED.md)"
            git push origin "$BRANCH"
            TITLE="Minecraft $MC: Open NPC needs a code update"
            if [ -z "$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[].number')" ]; then
              gh issue create --title "$TITLE" --body "The daily update tried Minecraft $MC (Fabric Loader $LOADER, Fabric API $API) and the build or its tests failed. The attempt and the error are on the branch \`$BRANCH\` (\`mod/UPDATE-FAILED.md\`). A fix comes as a pull request; nothing is released until it is merged."
            fi
          fi
          exit 1
      - name: "Dry run: what it found"
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          echo "Minecraft $MC (loader $LOADER, Fabric API $API): build and tests ${{ steps.try.outcome }}. Dry run: nothing released, committed or opened."
          test "${{ steps.try.outcome }}" = "success"
